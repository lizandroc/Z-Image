<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb">
<title>Pocket Doctor — Anatomy &amp; Natural Health Companion</title>
<style>
:root {
  --surface-1: #fcfcfb;
  --page: #f9f9f7;
  --ink-1: #0b0b0b;
  --ink-2: #52514e;
  --ink-3: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6;   /* blue  — primary vital series */
  --series-2: #1baf7a;   /* aqua  — secondary series (diastolic) */
  --series-3: #eda100;   /* yellow */
  --series-5: #4a3aa7;   /* violet */
  --accent: #2a78d6;
  --accent-wash: rgba(42,120,214,0.10);
  --good: #0ca30c;
  --good-text: #006300;
  --warning: #fab219;
  --serious: #ec835a;
  --critical: #d03b3b;
  --card-shadow: 0 1px 2px rgba(11,11,11,0.05), 0 4px 14px rgba(11,11,11,0.05);
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --surface-1: #1a1a19;
    --page: #0d0d0d;
    --ink-1: #ffffff;
    --ink-2: #c3c2b7;
    --ink-3: #898781;
    --grid: #2c2c2a;
    --baseline: #383835;
    --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --series-2: #199e70;
    --series-3: #c98500;
    --series-5: #9085e9;
    --accent: #3987e5;
    --accent-wash: rgba(57,135,229,0.16);
    --good-text: #0ca30c;
    --card-shadow: 0 1px 2px rgba(0,0,0,0.4), 0 4px 14px rgba(0,0,0,0.35);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--page);
  color: var(--ink-1);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink-1); }
h1,h2,h3,h4 { line-height: 1.25; font-weight: 650; }
a { color: var(--accent); }

/* ---------- App shell ---------- */
#app { max-width: 980px; margin: 0 auto; padding: 0 14px 90px; }
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 2px 10px;
}
.topbar .logo { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 17px; }
.logo-badge {
  width: 34px; height: 34px; border-radius: 10px; flex: 0 0 auto;
  background: var(--accent); color: #fff; display: grid; place-items: center;
  font-size: 18px;
}
.topbar .spacer { flex: 1; }
.profile-chip {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 999px; padding: 5px 12px 5px 6px; box-shadow: var(--card-shadow);
}
.avatar {
  width: 28px; height: 28px; border-radius: 50%;
  display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700;
  background: var(--series-5);
}
.profile-chip .name { font-weight: 600; font-size: 13px; max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Bottom navigation */
nav.tabs {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
  background: var(--surface-1); border-top: 1px solid var(--border);
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs .inner { display: flex; width: 100%; max-width: 980px; }
nav.tabs button {
  flex: 1; background: none; border: none; padding: 9px 2px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  color: var(--ink-3); font-size: 10.5px; font-weight: 600; letter-spacing: .01em;
}
nav.tabs button .ico { font-size: 20px; line-height: 1; }
nav.tabs button.active { color: var(--accent); }
nav.tabs button .dot {
  position: absolute; transform: translate(14px,-2px);
  width: 8px; height: 8px; border-radius: 50%; background: var(--critical);
  border: 2px solid var(--surface-1); display: none;
}
nav.tabs button.has-due .dot { display: block; }

/* ---------- Cards & layout ---------- */
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--card-shadow);
  padding: 16px; margin-bottom: 14px;
}
.card h3 { font-size: 15px; margin-bottom: 4px; }
.card .sub { color: var(--ink-2); font-size: 13px; }
.section-head {
  display: flex; align-items: baseline; gap: 10px; margin: 20px 2px 10px;
}
.section-head h2 { font-size: 17px; }
.section-head .hint { color: var(--ink-3); font-size: 12.5px; }
.section-head .right { margin-left: auto; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 560px) { .grid-2 { grid-template-columns: 1fr; } }
.tile-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-1); padding: 9px 15px; font-weight: 600; font-size: 13.5px;
  box-shadow: var(--card-shadow);
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { box-shadow: none; background: transparent; }
.btn.small { padding: 5px 11px; font-size: 12.5px; border-radius: 8px; }
.btn.danger { color: var(--critical); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Forms */
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 9px 11px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--page);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent;
}
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

/* Pills / chips */
.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 11.5px; font-weight: 650; border-radius: 999px; padding: 3px 10px;
  background: var(--accent-wash); color: var(--accent);
}
.pill.neutral { background: var(--page); color: var(--ink-2); border: 1px solid var(--border); }
.pill.good { background: rgba(12,163,12,0.12); color: var(--good-text); }
.pill.warn { background: rgba(250,178,25,0.16); color: #8a5b00; }
.pill.serious { background: rgba(236,131,90,0.16); color: #a34317; }
.pill.crit { background: rgba(208,59,59,0.13); color: var(--critical); }
@media (prefers-color-scheme: dark) {
  .pill.warn { color: var(--warning); }
  .pill.serious { color: var(--serious); }
}

/* Filter row (chips) */
.filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.filter-row .fchip {
  border: 1px solid var(--border); background: var(--surface-1);
  padding: 5px 12px; border-radius: 999px; font-size: 12.5px; font-weight: 600; color: var(--ink-2);
}
.filter-row .fchip.on { background: var(--accent); border-color: transparent; color: #fff; }

/* ---------- Stat tiles ---------- */
.stat-tile {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--card-shadow);
  padding: 12px 14px; text-align: left; width: 100%;
  display: flex; flex-direction: column; gap: 2px; position: relative;
}
.stat-tile:hover { border-color: var(--accent); }
.stat-tile .label { font-size: 12px; font-weight: 600; color: var(--ink-2); display:flex; align-items:center; gap:6px; }
.stat-tile .value { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; }
.stat-tile .value .unit { font-size: 12.5px; font-weight: 600; color: var(--ink-3); margin-left: 3px; }
.stat-tile .delta { font-size: 11.5px; font-weight: 650; }
.stat-tile .delta.up-good, .stat-tile .delta.down-bad-not { color: var(--good-text); }
.stat-tile .delta.bad { color: var(--critical); }
.stat-tile .delta.flat { color: var(--ink-3); }
.stat-tile .spark { margin-top: 6px; }
.stat-tile .status-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }

/* ---------- Charts ---------- */
.chart-card { overflow: hidden; }
.chart-head { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.chart-head h3 { flex: 1; }
.chart-head .latest { font-weight: 650; font-size: 15px; }
.chart-head .caret { color: var(--ink-3); transition: transform .18s ease; font-size: 12px; }
.chart-card.open .caret { transform: rotate(180deg); }
.chart-body { display: none; margin-top: 12px; }
.chart-card.open .chart-body { display: block; }
.legend { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 4px 0 6px; }
.legend .key { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); font-weight: 600; }
.legend .key .swatch-line { width: 14px; height: 0; border-top: 3px solid; border-radius: 2px; }
.range-row { display: flex; gap: 6px; margin-bottom: 8px; }
.range-row button {
  border: 1px solid var(--border); background: transparent; color: var(--ink-2);
  font-size: 11.5px; font-weight: 650; border-radius: 8px; padding: 3px 10px;
}
.range-row button.on { background: var(--accent); color: #fff; border-color: transparent; }
.chart-wrap { position: relative; }
.chart-wrap svg { display: block; width: 100%; height: auto; }
.viz-tooltip {
  position: absolute; pointer-events: none; z-index: 5;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px;
  box-shadow: var(--card-shadow); padding: 8px 11px; font-size: 12px; min-width: 120px;
  display: none;
}
.viz-tooltip .tt-date { color: var(--ink-3); font-size: 11px; margin-bottom: 3px; }
.viz-tooltip .tt-row { display: flex; align-items: center; gap: 7px; }
.viz-tooltip .tt-row .k { width: 12px; border-top: 3px solid; border-radius: 2px; }
.viz-tooltip .tt-row .v { font-weight: 700; }
.viz-tooltip .tt-row .n { color: var(--ink-2); }
.axis-text { font-size: 10.5px; fill: var(--ink-3); }
.table-toggle { margin-top: 8px; }
table.data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
table.data-table th { text-align: left; color: var(--ink-2); font-weight: 650; padding: 5px 8px; border-bottom: 1px solid var(--grid); }
table.data-table td { padding: 5px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }

/* Meter (evaluation report) */
.meter { height: 10px; border-radius: 6px; background: var(--grid); overflow: hidden; position: relative; }
.meter .fill { height: 100%; border-radius: 6px; }
.sys-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--grid); }
.sys-row:last-child { border-bottom: none; }
.sys-row .nm { flex: 0 0 148px; font-size: 13px; font-weight: 600; }
.sys-row .meter { flex: 1; }
.sys-row .sc { flex: 0 0 44px; text-align: right; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }

/* Hero number */
.hero-score { display: flex; align-items: center; gap: 18px; }
.hero-score .num { font-size: 54px; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
.hero-score .of { color: var(--ink-3); font-size: 15px; font-weight: 600; }

/* ---------- Body map ---------- */
.bodymap-layout { display: grid; grid-template-columns: minmax(230px, 340px) 1fr; gap: 14px; align-items: start; }
@media (max-width: 700px) { .bodymap-layout { grid-template-columns: 1fr; } }
.bodymap-fig { padding: 10px 6px; }
.bodymap-fig svg { width: 100%; height: auto; display: block; max-height: 72vh; }
.body-outline { fill: var(--accent-wash); stroke: var(--baseline); stroke-width: 2; }
.organ { cursor: pointer; transition: filter .12s ease, opacity .12s ease; }
.organ .shape { stroke: var(--surface-1); stroke-width: 1.5; opacity: .82; }
.organ:hover .shape, .organ.sel .shape { opacity: 1; filter: brightness(1.1); }
.organ.sel .shape { stroke: var(--ink-1); stroke-width: 2; }
.organ-label { font-size: 11px; font-weight: 700; fill: var(--ink-2); pointer-events: none; }
.hotspot { fill: transparent; cursor: pointer; }
.region-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.region-list button {
  border: 1px solid var(--border); background: var(--surface-1); border-radius: 999px;
  font-size: 12px; font-weight: 600; padding: 4px 11px; color: var(--ink-2);
}
.region-list button.on { background: var(--accent); color: #fff; border-color: transparent; }
.anatomy-panel h3 { font-size: 18px; display: flex; align-items: center; gap: 9px; }
.anatomy-panel .fact { margin: 10px 0; }
.anatomy-panel .fact b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); margin-bottom: 2px; }
.remedy-mini {
  border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; margin-top: 8px;
  background: var(--page);
}
.remedy-mini .t { font-weight: 650; font-size: 13.5px; }
.remedy-mini .d { font-size: 12.5px; color: var(--ink-2); }
.redflag {
  border-left: 3px solid var(--critical); background: rgba(208,59,59,0.07);
  border-radius: 0 10px 10px 0; padding: 10px 12px; margin-top: 12px; font-size: 13px;
}
.redflag b { color: var(--critical); }

/* ---------- Remedies ---------- */
.search-bar { position: relative; margin-bottom: 12px; }
.search-bar input { width: 100%; padding: 10px 13px 10px 36px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-1); box-shadow: var(--card-shadow); }
.search-bar .mag { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); }
.remedy-card .tradition { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.remedy-card h3 { margin: 3px 0 2px; }
.remedy-card .uses { font-size: 13px; color: var(--ink-2); }
.remedy-detail dt { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); font-weight: 700; margin-top: 12px; }
.remedy-detail dd { margin-top: 2px; font-size: 13.5px; }
.caution {
  border-left: 3px solid var(--warning); background: rgba(250,178,25,0.09);
  border-radius: 0 10px 10px 0; padding: 9px 12px; margin-top: 12px; font-size: 12.5px;
}

/* ---------- Reminders ---------- */
.rem-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--grid); }
.rem-row:last-child { border-bottom: none; }
.rem-row .ico { font-size: 20px; }
.rem-row .body { flex: 1; min-width: 0; }
.rem-row .t { font-weight: 650; font-size: 14px; }
.rem-row .s { font-size: 12px; color: var(--ink-2); }
.rem-row.due .t::after { content: "due"; margin-left: 8px; font-size: 10px; font-weight: 700; color: #fff; background: var(--critical); padding: 2px 7px; border-radius: 999px; vertical-align: 2px; }

/* ---------- Evaluation wizard ---------- */
.wiz-progress { display: flex; gap: 4px; margin-bottom: 16px; }
.wiz-progress span { flex: 1; height: 5px; border-radius: 3px; background: var(--grid); }
.wiz-progress span.done { background: var(--accent); }
.q-block { margin-bottom: 16px; }
.q-block .q { font-weight: 600; font-size: 14px; margin-bottom: 8px; }
.q-opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
@media (max-width: 480px) { .q-opts { grid-template-columns: repeat(2, 1fr); } }
.q-opts button {
  border: 1px solid var(--border); background: var(--surface-1); border-radius: 10px;
  padding: 8px 4px; font-size: 12px; font-weight: 600; color: var(--ink-2);
}
.q-opts button.on { background: var(--accent); color: #fff; border-color: transparent; }

/* ---------- Portal ---------- */
.portal-hero { text-align: center; padding: 34px 10px 20px; }
.portal-hero .big-badge {
  width: 72px; height: 72px; border-radius: 22px; margin: 0 auto 14px;
  background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 38px;
  box-shadow: var(--card-shadow);
}
.portal-hero h1 { font-size: 26px; }
.portal-hero p { color: var(--ink-2); max-width: 460px; margin: 8px auto 0; font-size: 14px; }
.profile-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 20px; }
.profile-card {
  background: var(--surface-1); border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: var(--card-shadow); padding: 20px 12px; text-align: center;
}
.profile-card:hover { border-color: var(--accent); }
.profile-card .avatar { width: 52px; height: 52px; font-size: 22px; margin: 0 auto 10px; }
.profile-card .nm { font-weight: 650; }
.profile-card .meta { font-size: 12px; color: var(--ink-3); }
.profile-card.add { border-style: dashed; color: var(--ink-2); background: transparent; box-shadow: none; }
.profile-card.add .plus { font-size: 30px; color: var(--accent); }

/* ---------- Modal ---------- */
.modal-scrim {
  position: fixed; inset: 0; background: rgba(11,11,11,0.45); z-index: 60;
  display: grid; place-items: center; padding: 16px;
}
.modal {
  background: var(--surface-1); border-radius: 18px; box-shadow: var(--card-shadow);
  width: 100%; max-width: 520px; max-height: 86vh; overflow-y: auto; padding: 22px;
}
.modal h3 { font-size: 17px; margin-bottom: 6px; }
.modal .sub { color: var(--ink-2); font-size: 13px; margin-bottom: 14px; }

/* Disclaimer banner */
.disclaimer {
  font-size: 11.5px; color: var(--ink-3); text-align: center;
  padding: 18px 20px 6px; line-height: 1.5;
}

/* Report print */
@media print {
  nav.tabs, .topbar, .no-print { display: none !important; }
  body { background: #fff; }
  .card { box-shadow: none; break-inside: avoid; }
  #app { padding-bottom: 0; }
}
.empty {
  text-align: center; color: var(--ink-3); padding: 26px 10px; font-size: 13.5px;
}
.empty .big { font-size: 34px; display: block; margin-bottom: 6px; }
.list-plain { list-style: none; }
.list-plain li { padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 13.5px; display: flex; gap: 9px; align-items: flex-start; }
.list-plain li:last-child { border-bottom: none; }
.list-plain .li-ico { flex: 0 0 auto; }
.toast {
  position: fixed; left: 50%; bottom: 78px; transform: translateX(-50%);
  background: var(--ink-1); color: var(--page); font-size: 13px; font-weight: 600;
  padding: 9px 18px; border-radius: 999px; z-index: 80; box-shadow: var(--card-shadow);
  animation: toast-in .2s ease;
}
@keyframes toast-in { from { opacity: 0; transform: translate(-50%, 8px);} to { opacity: 1; transform: translate(-50%, 0);} }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabbar" style="display:none">
  <div class="inner">
    <button data-tab="dashboard"><span class="ico">▦</span>Dashboard<span class="dot"></span></button>
    <button data-tab="vitals"><span class="ico">♥</span>Vitals<span class="dot"></span></button>
    <button data-tab="body"><span class="ico">☺</span>Body Map<span class="dot"></span></button>
    <button data-tab="remedies"><span class="ico">✿</span>Remedies<span class="dot"></span></button>
    <button data-tab="checkup"><span class="ico">✓</span>Check-Up<span class="dot"></span></button>
  </div>
</nav>
<script>
"use strict";
/* ==========================================================================
   Pocket Doctor — single-file health companion
   Sections:  DATA  ·  STORAGE  ·  HELPERS  ·  CHARTS  ·  VIEWS  ·  ROUTER
   All data lives on-device (localStorage). Nothing is sent anywhere.
   ========================================================================== */

/* ------------------------------- DATA ---------------------------------- */

// Vital metric definitions: healthy reference ranges + how to read a delta.
const VITALS = {
  bp: {
    key: "bp", name: "Blood pressure", unit: "mmHg", icon: "🩸",
    series: [
      { id: "sys", name: "Systolic",  color: "var(--series-1)", raw: "#2a78d6" },
      { id: "dia", name: "Diastolic", color: "var(--series-2)", raw: "#1baf7a" }
    ],
    primary: "sys",
    normal: { sys: [90, 120], dia: [60, 80] },
    format: v => `${v.sys}/${v.dia}`,
    goodDirection: "down",
    classify: v => {
      if (v.sys >= 180 || v.dia >= 120) return "critical";
      if (v.sys >= 140 || v.dia >= 90)  return "serious";
      if (v.sys >= 130 || v.dia >= 80)  return "warning";
      if (v.sys < 90  || v.dia < 60)    return "warning";
      return "good";
    }
  },
  hr: {
    key: "hr", name: "Resting heart rate", unit: "bpm", icon: "💓",
    series: [{ id: "hr", name: "Heart rate", color: "var(--series-1)", raw: "#2a78d6" }],
    primary: "hr",
    normal: { hr: [60, 100] },
    format: v => `${v.hr}`,
    goodDirection: "down",
    classify: v => {
      if (v.hr >= 130 || v.hr <= 40) return "serious";
      if (v.hr > 100 || v.hr < 50)   return "warning";
      return "good";
    }
  },
  weight: {
    key: "weight", name: "Weight", unit: "lb", icon: "⚖️",
    series: [{ id: "weight", name: "Weight", color: "var(--series-1)", raw: "#2a78d6" }],
    primary: "weight",

const LS_KEY = "pocketDoctor.v1";
let DB = { profiles: [], activeId: null };

function loadDB() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) DB = JSON.parse(raw);
  } catch (e) { /* corrupt or unavailable — start fresh */ }
  if (!DB.profiles) DB.profiles = [];
}
function saveDB() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(DB)); } catch (e) {}
}
function activeProfile() { return DB.profiles.find(p => p.id === DB.activeId) || null; }

const AVATAR_COLORS = ["#4a3aa7","#2a78d6","#1baf7a","#e34948","#eb6834","#e87ba4","#eda100"];
function pickAvatarColor() { return AVATAR_COLORS[DB.profiles.length % AVATAR_COLORS.length]; }

function newProfile(name, opts = {}) {
  return {
    id: "p_" + Math.random().toString(36).slice(2, 9),
    name: name || "Me",
    color: opts.color || pickAvatarColor(),
    age: opts.age || "",
    sex: opts.sex || "",
    created: Date.now(),
    readings: {},   // { vitalKey: [ {t, ...values} ] }
    reminders: {},  // { templateId: { lastDone: t } }
    evaluations: [] // [ { t, answers, scores, overall } ]
  };
}

// Seed a realistic demo profile the first time, so charts aren't empty.
function seedDemo() {
  const p = newProfile("Alex", { color:"#4a3aa7", age:"41", sex:"—" });
  const now = Date.now(), day = 86400000;
  const rnd = (a,b) => a + Math.random()*(b-a);
  const push = (key,r) => (p.readings[key] = p.readings[key]||[]).push(r);
  for (let i = 60; i >= 0; i--) {
    const t = now - i*day;
    if (i % 2 === 0) push("bp",{ t, sys: Math.round(rnd(118,134) - i*0.06), dia: Math.round(rnd(74,86) - i*0.03) });
    if (i % 3 === 0) push("hr",{ t, hr: Math.round(rnd(64,78)) });
    if (i % 7 === 0) push("weight",{ t, weight: +(182 - (60-i)*0.09 + rnd(-0.6,0.6)).toFixed(1) });
    if (i % 5 === 0) push("temp",{ t, temp: +rnd(97.6,98.8).toFixed(1) });
    if (i % 6 === 0) push("spo2",{ t, spo2: Math.round(rnd(96,99)) });
    if (i % 10 === 0) push("glucose",{ t, glucose: Math.round(rnd(86,102)) });
  }
  p.reminders = { water:{lastDone: now-day*1.2}, move:{lastDone: now-day*0.4}, bp:{lastDone: now-day*2},
                  weight:{lastDone: now-day*8}, hr:{lastDone: now-day*3}, eval:{lastDone: now-day*20}, annual:{lastDone: now-day*120} };
  DB.profiles.push(p);
  DB.activeId = p.id;
  saveDB();
}

const $ = (sel, root=document) => root.querySelector(sel);
const el = (tag, attrs={}, ...kids) => {
  const n = document.createElement(tag);
  for (const k in attrs) {
    if (k === "class") n.className = attrs[k];
    else if (k === "html") n.innerHTML = attrs[k];
    else if (k.startsWith("on") && typeof attrs[k] === "function") n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  }
  for (const kid of kids) { if (kid == null) continue; n.append(kid.nodeType ? kid : document.createTextNode(kid)); }
  return n;
};
function svgEl(tag, attrs={}) {
  const n = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const k in attrs) if (attrs[k] != null) n.setAttribute(k, attrs[k]);
  return n;
}
const fmtDate = t => new Date(t).toLocaleDateString(undefined, { month:"short", day:"numeric" });
const fmtDateFull = t => new Date(t).toLocaleDateString(undefined, { year:"numeric", month:"short", day:"numeric" });
const daysAgo = t => Math.floor((Date.now()-t)/86400000);
function relTime(t){ const d=daysAgo(t); if(d<=0) return "today"; if(d===1) return "yesterday"; if(d<7) return d+" days ago"; if(d<30) return Math.floor(d/7)+"w ago"; return Math.floor(d/30)+"mo ago"; }

const STATUS_LABEL = { good:"Healthy", warning:"Watch", serious:"Elevated", critical:"Urgent" };
const STATUS_PILL  = { good:"good", warning:"warn", serious:"serious", critical:"crit" };
const STATUS_COLOR = { good:"var(--good)", warning:"var(--warning)", serious:"var(--serious)", critical:"var(--critical)" };

function lastReading(p, key){ const a = p.readings[key]; return a && a.length ? a[a.length-1] : null; }
function statusOf(key, reading){ return reading ? VITALS[key].classify(reading) : null; }

let toastTimer;
function toast(msg){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = el("div",{class:"toast"}, msg); document.body.append(t);

/* Responsive SVG line chart with crosshair + shared tooltip, healthy band,
   range filter and a table view. Follows the dataviz mark specs. */

function sparkline(points, color, w=112, h=30) {
  if (!points.length) return el("div");
  const xs = points.map(p=>p.x), ys = points.map(p=>p.y);
  const minX=Math.min(...xs), maxX=Math.max(...xs);
  const minY=Math.min(...ys), maxY=Math.max(...ys);
  const pad=3, sx=x=>pad+(maxX===minX?0:(x-minX)/(maxX-minX))*(w-2*pad);
  const sy=y=>maxY===minY? h/2 : (h-pad)-((y-minY)/(maxY-minY))*(h-2*pad);
  const svg=svgEl("svg",{viewBox:`0 0 ${w} ${h}`,width:w,height:h,"aria-hidden":"true"});
  const d=points.map((p,i)=>(i?"L":"M")+sx(p.x).toFixed(1)+" "+sy(p.y).toFixed(1)).join(" ");
  svg.append(svgEl("path",{d,fill:"none",stroke:color,"stroke-width":2,"stroke-linecap":"round","stroke-linejoin":"round","opacity":.55}));
  const last=points[points.length-1];
  svg.append(svgEl("circle",{cx:sx(last.x),cy:sy(last.y),r:3.2,fill:color}));
  return svg;
}

function makeLineChart(vital, readings, rangeDays) {
  const wrap = el("div",{class:"chart-wrap"});
  const W=680, H=240, mL=42, mR=16, mT=14, mB=26;
  const cutoff = rangeDays ? Date.now()-rangeDays*86400000 : 0;
  const data = readings.filter(r=>r.t>=cutoff);
  if (data.length < 1) { wrap.append(el("div",{class:"empty"}, el("span",{class:"big"},"📈"), "No readings in this range yet.")); return wrap; }

  const series = vital.series;
  const allVals = [];
  data.forEach(r=>series.forEach(s=>{ if(r[s.id]!=null) allVals.push(r[s.id]); }));
  if (vital.normal) series.forEach(s=>{ const n=vital.normal[s.id]; if(n){ allVals.push(n[0], n[1]); }});
  let minY=Math.min(...allVals), maxY=Math.max(...allVals);
  const padY=(maxY-minY)*0.12 || 2; minY-=padY; maxY+=padY;
  const minT=data[0].t, maxT=data[data.length-1].t;
  const sx=t=>mL+(maxT===minT?0.5*(W-mL-mR):((t-minT)/(maxT-minT))*(W-mL-mR));
  const sy=v=>mT+(1-(v-minY)/(maxY-minY))*(H-mT-mB);

  const svg=svgEl("svg",{viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":vital.name+" over time"});

  // healthy band(s)
  if (vital.normal) {
    series.forEach(s=>{ const n=vital.normal[s.id]; if(!n) return;
      svg.append(svgEl("rect",{x:mL,y:sy(n[1]).toFixed(1),width:W-mL-mR,height:Math.abs(sy(n[0])-sy(n[1])).toFixed(1),fill:s.raw,opacity:.06}));
    });
  }
  // gridlines + y ticks
  const ticks=4;
  for(let i=0;i<=ticks;i++){
    const v=minY+(maxY-minY)*i/ticks, y=sy(v);
    svg.append(svgEl("line",{x1:mL,y1:y.toFixed(1),x2:W-mR,y2:y.toFixed(1),stroke:"var(--grid)","stroke-width":1}));
    const tx=svgEl("text",{x:mL-6,y:(y+3).toFixed(1),"text-anchor":"end",class:"axis-text"}); tx.textContent=Math.round(v); svg.append(tx);
  }
  // x labels (first, mid, last)
  [minT, (minT+maxT)/2, maxT].forEach((t,i)=>{
    const tx=svgEl("text",{x:sx(t).toFixed(1),y:H-8,"text-anchor":i===0?"start":i===2?"end":"middle",class:"axis-text"});
    tx.textContent=fmtDate(t); svg.append(tx);
  });

  // lines + end dots
  series.forEach(s=>{
    const pts=data.filter(r=>r[s.id]!=null).map(r=>({t:r.t,v:r[s.id]}));
    if(!pts.length) return;
    const d=pts.map((p,i)=>(i?"L":"M")+sx(p.t).toFixed(1)+" "+sy(p.v).toFixed(1)).join(" ");
    svg.append(svgEl("path",{d,fill:"none",stroke:s.raw,"stroke-width":2,"stroke-linecap":"round","stroke-linejoin":"round"}));
    const last=pts[pts.length-1];
    svg.append(svgEl("circle",{cx:sx(last.t),cy:sy(last.v),r:4,fill:s.raw,stroke:"var(--surface-1)","stroke-width":2}));
  });

  // crosshair + hover
  const cross=svgEl("line",{x1:0,y1:mT,x2:0,y2:H-mB,stroke:"var(--baseline)","stroke-width":1,opacity:0});
  svg.append(cross);
  const focusDots=series.map(s=>{ const c=svgEl("circle",{r:4.5,fill:s.raw,stroke:"var(--surface-1)","stroke-width":2,opacity:0}); svg.append(c); return c; });
  const tip=el("div",{class:"viz-tooltip"}); wrap.append(tip);
  const hit=svgEl("rect",{x:mL,y:mT,width:W-mL-mR,height:H-mT-mB,fill:"transparent"});
  svg.append(hit);

  function nearest(t){ let best=data[0],bd=Infinity; for(const r of data){ const dd=Math.abs(r.t-t); if(dd<bd){bd=dd;best=r;} } return best; }
  function onMove(ev){
    const rect=svg.getBoundingClientRect();
    const px=(ev.clientX-rect.left)/rect.width*W;
    const t=minT+((px-mL)/(W-mL-mR))*(maxT-minT);
    const r=nearest(t), rx=sx(r.t);
    cross.setAttribute("x1",rx); cross.setAttribute("x2",rx); cross.setAttribute("opacity",1);
    tip.style.display="block";
    tip.innerHTML="";
    tip.append(el("div",{class:"tt-date"}, fmtDateFull(r.t)));
    series.forEach((s,i)=>{
      if(r[s.id]==null){ focusDots[i].setAttribute("opacity",0); return; }
      focusDots[i].setAttribute("cx",rx); focusDots[i].setAttribute("cy",sy(r[s.id])); focusDots[i].setAttribute("opacity",1);
      const row=el("div",{class:"tt-row"});
      row.append(el("span",{class:"k",style:`border-color:${s.raw}`}));
      row.append(el("span",{class:"v"}, String(r[s.id])));
      row.append(el("span",{class:"n"}, s.name));
      tip.append(row);
    });
    const tx=Math.min(Math.max(rx/W*rect.width+10,4), rect.width-140);
    tip.style.left=tx+"px"; tip.style.top="6px";
  }
  function onLeave(){ cross.setAttribute("opacity",0); tip.style.display="none"; focusDots.forEach(d=>d.setAttribute("opacity",0)); }
  hit.addEventListener("pointermove",onMove);
  hit.addEventListener("pointerleave",onLeave);

  wrap.append(svg);
  return wrap;
}

function scoreBand(s){
  if (s>=80) return {label:"Thriving", pill:"good", color:"var(--good-text)"};
  if (s>=60) return {label:"Good", pill:"good", color:"var(--good-text)"};
  if (s>=40) return {label:"Fair — room to improve", pill:"warn", color:"#8a5b00"};
  return {label:"Needs attention", pill:"crit", color:"var(--critical)"};
}

function vitalTile(p, key) {
  const v=VITALS[key]; const last=lastReading(p,key);
  const status=statusOf(key,last);
  const tile=el("button",{class:"stat-tile",onclick:()=>{ STATE.chartsOpen[key]=true; go("vitals"); setTimeout(()=>{ const node=document.getElementById("chart-"+key); if(node) node.scrollIntoView({behavior:"smooth",block:"center"}); },60); }});
  const label=el("div",{class:"label"}, el("span",{style:"font-size:15px"},v.icon), v.name);
  if (status) label.append(el("span",{class:"status-dot",style:`background:${STATUS_COLOR[status]};margin-left:auto`,title:STATUS_LABEL[status]}));
  tile.append(label);
  if (last) {
    tile.append(el("div",{class:"value"}, v.format(last), el("span",{class:"unit"}, v.unit)));
    const arr=p.readings[key];
    if (arr.length>1) {
      const prev=arr[arr.length-2], pid=v.primary;
      const diff=+(last[pid]-prev[pid]).toFixed(1);
      if (diff!==0) {
        const goodDir=v.goodDirection;
        const isGood = goodDir==="neutral"? null : (diff<0)===(goodDir==="down");
        const cls = isGood===null? "flat" : isGood? "up-good":"bad";
        tile.append(el("div",{class:"delta "+cls}, (diff>0?"▲ +":"▼ ")+diff+" "+v.unit+" · "+relTime(last.t)));
      } else tile.append(el("div",{class:"delta flat"},"no change · "+relTime(last.t)));
    } else tile.append(el("div",{class:"delta flat"}, relTime(last.t)));
    const pts=p.readings[key].slice(-14).map(r=>({x:r.t,y:r[v.primary]}));
    tile.append(el("div",{class:"spark"}, sparkline(pts, v.series[0].raw)));
  } else {
    tile.append(el("div",{class:"value",style:"color:var(--ink-3);font-size:15px;font-weight:600;margin-top:4px"},"Tap to log"));
  }
  return tile;
}

    tbl.append(el("thead",{},hr));

      tb.append(row);
    });
    tbl.append(tb); tw.append(tbl);

  BODY.forEach(b=>{

    const g=svgEl("g",{class:"organ"+(STATE.bodySel===b.id?" sel":""),role:"button",tabindex:"0","aria-label":b.name});
    if (b.id==="lungs") {
      g.append(svgEl("ellipse",{cx:88,cy:120,rx:12,ry:22,class:"shape",fill:b.raw}));
      g.append(svgEl("ellipse",{cx:112,cy:120,rx:12,ry:22,class:"shape",fill:b.raw}));
    } else if (b.id==="joints") {
      g.append(svgEl("circle",{cx:86,cy:330,r:8,class:"shape",fill:b.raw}));   // left knee
      g.append(svgEl("circle",{cx:114,cy:360,r:8,class:"shape",fill:b.raw}));  // right knee
    } else if (b.id==="immune") {
      g.append(svgEl("circle",{cx:143,cy:120,r:8,class:"shape",fill:b.raw}));  // arm/skin
      g.append(svgEl("circle",{cx:57,cy:120,r:8,class:"shape",fill:b.raw}));
    } else if (b.id==="head") {
      g.append(svgEl("circle",{cx:100,cy:34,r:14,class:"shape",fill:b.raw}));
    } else {
      g.append(svgEl("circle",{cx:s[0],cy:s[1],r:Math.min(s[2]*0.6,13),class:"shape",fill:b.raw}));
    }
    g.append(svgEl("circle",{cx:s[0],cy:s[1],r:Math.max(s[2],18),class:"hotspot"}));
    const act=()=>{ STATE.bodySel=b.id; render(); };
    g.addEventListener("click",act);
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); act(); }});
    svg.append(g);
  });
  card.append(svg);
  const list=el("div",{class:"region-list"});
  BODY.forEach(b=>list.append(el("button",{class:(STATE.bodySel===b.id?"on":""),onclick:()=>{ STATE.bodySel=b.id; render(); }}, b.emoji+" "+b.name.split(" ")[0])));
  card.append(list);
  return card;
}

function anatomyPanel(p) {
  const b=BODY.find(x=>x.id===STATE.bodySel)||BODY[0];
  const card=el("div",{class:"card anatomy-panel"});
  card.append(el("h3",{}, el("span",{style:`display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;background:${b.raw};color:#fff;font-size:18px`},b.emoji), b.name));
  card.append(el("div",{class:"fact"}, el("b",{},"What it is"), el("div",{}, b.what)));
  card.append(el("div",{class:"fact"}, el("b",{},"What it does"), el("div",{}, b.keeps)));
  card.append(el("div",{class:"fact"}, el("b",{},"Common concerns"),
    el("div",{class:"filter-row",style:"margin:4px 0 0"}, ...b.concerns.map(c=>el("span",{class:"pill neutral"},c)))));
  card.append(el("div",{class:"fact"}, el("b",{},"Everyday care"), el("div",{}, b.selfcare)));

  card.append(el("b",{style:"font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);display:block;margin-top:14px"},"Natural support"));
  b.remedies.map(id=>REMEDIES.find(r=>r.id===id)).filter(Boolean).slice(0,5).forEach(r=>{
    card.append(el("button",{class:"remedy-mini",style:"display:block;width:100%;text-align:left",onclick:()=>openRemedy(r.id)},
      el("div",{class:"t"}, r.emoji+" "+r.name+"  ", evidenceTag(r.evidence)),
      el("div",{class:"d"}, r.uses.slice(0,3).join(" · "))));
  });
  card.append(el("div",{class:"redflag"}, el("b",{},"⚠ When to see a doctor: "), b.redflag));
  return card;
}
function evidenceTag(ev){
  const map={strong:["good","Well-studied"],moderate:["warn","Supportive evidence"],traditional:["neutral","Traditional use"]};
  const [cls,lbl]=map[ev]||["neutral",ev];
  return el("span",{class:"pill "+cls,style:"font-size:10px;padding:1px 7px;vertical-align:1px"}, lbl);
}

/* --- Remedies --- */
const TRADITIONS=[["all","All"],["Western","Western herbal"],["Ayurveda","Ayurveda"],["TCM","Chinese medicine"],["Home","Home & food"]];
function viewRemedies(p) {
  const frag=document.createDocumentFragment();
  frag.append(el("div",{class:"section-head"}, el("h2",{},"Natural remedy guide"), el("span",{class:"hint"},"time-tested, evidence-labeled")));
  const sb=el("div",{class:"search-bar"}, el("span",{class:"mag"},"🔍"),
    el("input",{type:"search",placeholder:"Search remedies or symptoms…",value:STATE.remedyQuery,
      oninput:e=>{ STATE.remedyQuery=e.target.value; refreshRemedyList(); }}));
  frag.append(sb);
  const fr=el("div",{class:"filter-row"});
  TRADITIONS.forEach(([k,lbl])=>fr.append(el("button",{class:"fchip"+(STATE.remedyFilter===k?" on":""),onclick:()=>{ STATE.remedyFilter=k; refreshRemedyList(); }},lbl)));
  frag.append(fr);
  const grid=el("div",{class:"grid-2",id:"remedy-grid"});
  frag.append(grid);
  setTimeout(refreshRemedyList,0);
  return frag;
}
function refreshRemedyList() {
  const grid=$("#remedy-grid"); if(!grid) return;
  grid.innerHTML="";
  const q=STATE.remedyQuery.trim().toLowerCase();
  const list=REMEDIES.filter(r=>{
    const okT = STATE.remedyFilter==="all" || r.tradition.toLowerCase().includes(STATE.remedyFilter.toLowerCase());
    const hay=(r.name+" "+r.uses.join(" ")+" "+r.why+" "+r.tradition).toLowerCase();
    const okQ = !q || hay.includes(q);
    return okT && okQ;
  });
  if(!list.length){ grid.append(el("div",{class:"empty"}, el("span",{class:"big"},"🌿"),"No remedies match. Try another search.")); return; }
  list.forEach(r=>{
    grid.append(el("button",{class:"card remedy-card",style:"text-align:left;cursor:pointer",onclick:()=>openRemedy(r.id)},
      el("div",{style:"display:flex;justify-content:space-between;align-items:start;gap:8px"},
        el("div",{class:"tradition",style:"color:var(--ink-3)"}, r.tradition),
        el("span",{style:"font-size:22px"}, r.emoji)),
      el("h3",{}, r.name),
      el("div",{class:"uses"}, r.uses.slice(0,3).join(" · ")),
      el("div",{style:"margin-top:8px"}, evidenceTag(r.evidence))
    ));
  });
}
function openRemedy(id){ STATE.modal={type:"remedy",id}; renderModal(); }

/* --- Check-up: reminders + evaluation --- */
function viewCheckup(p) {
  const frag=document.createDocumentFragment();
  const lastEval=p.evaluations[p.evaluations.length-1];
  frag.append(el("div",{class:"section-head"}, el("h2",{},"Full-body evaluation"),
    el("span",{class:"right"}, el("button",{class:"btn small primary",onclick:()=>startEval()}, lastEval?"Re-evaluate":"Start evaluation"))));
  if (lastEval) frag.append(evalReport(p,lastEval));
  else frag.append(el("div",{class:"card empty"}, el("span",{class:"big"},"🩺"),"No evaluation yet. Answer 12 quick questions to get your wellness score, a system breakdown, and natural recommendations."));

  frag.append(el("div",{class:"section-head"}, el("h2",{},"Check-in reminders"), el("span",{class:"hint"},"tap ✓ when done")));
  const c=el("div",{class:"card"});
  REMINDER_TEMPLATES.forEach(t=>c.append(reminderRow(p,t)));
  frag.append(c);
  return frag;
}

function dueReminders(p) {
  const now=Date.now();
  return REMINDER_TEMPLATES.filter(t=>{
    const last=p.reminders[t.id]?.lastDone;
    if (last==null) return true;
    return (now-last) >= t.every*86400000;
  });
}
function reminderRow(p,t) {
  const last=p.reminders[t.id]?.lastDone;
  const due = last==null || (Date.now()-last)>=t.every*86400000;
  const row=el("div",{class:"rem-row"+(due?" due":"")});
  row.append(el("span",{class:"ico"}, t.icon));
  row.append(el("div",{class:"body"}, el("div",{class:"t"}, t.title), el("div",{class:"s"}, t.detail + " · " + (last?("last "+relTime(last)):"never") + " · every "+everyLabel(t.every))));
  row.append(el("button",{class:"btn small"+(due?" primary":" ghost"),onclick:()=>{ (p.reminders[t.id]=p.reminders[t.id]||{}).lastDone=Date.now(); saveDB(); toast("Marked done ✓"); render(); }}, due?"✓ Do":"✓"));
  return row;
}
function everyLabel(d){ if(d===1) return "day"; if(d===7) return "week"; if(d===14) return "2 weeks"; if(d===30) return "month"; if(d===365) return "year"; return d+" days"; }

function evalReport(p, ev) {
  const card=el("div",{class:"card"});
  const band=scoreBand(ev.overall);
  card.append(el("div",{style:"display:flex;align-items:center;gap:16px;flex-wrap:wrap"},
    el("div",{class:"hero-score"}, el("div",{class:"num",style:`color:${band.color}`}, String(ev.overall)), el("div",{class:"of"},"/100")),
    el("div",{}, el("span",{class:"pill "+band.pill}, band.label), el("div",{class:"sub",style:"margin-top:4px"}, "Evaluated "+fmtDateFull(ev.t)))
  ));
  card.append(el("b",{style:"display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:16px 0 4px"},"By body system"));
  const bySys=Object.entries(ev.scores).sort((a,b)=>a[1]-b[1]);
  bySys.forEach(([sys,sc])=>{
    const b=BODY.find(x=>x.id===sys);
    const color = sc>=70?"var(--good)": sc>=45?"var(--warning)":"var(--critical)";
    card.append(el("div",{class:"sys-row"},
      el("div",{class:"nm"}, (b?b.emoji+" ":"")+(b?b.name.split(" ")[0]:sys)),
      el("div",{class:"meter"}, el("div",{class:"fill",style:`width:${sc}%;background:${color}`})),
      el("div",{class:"sc"}, String(sc))
    ));
  });
  card.append(el("b",{style:"display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-3);margin:18px 0 4px"},"Recommendations"));
  const recs=buildRecommendations(ev);
  const ul=el("ul",{class:"list-plain"});
  recs.forEach(r=>ul.append(el("li",{}, el("span",{class:"li-ico"}, r.icon), el("span",{}, r.text, r.remedyId? el("button",{class:"btn small ghost",style:"margin-left:6px;padding:2px 8px",onclick:()=>openRemedy(r.remedyId)},"see remedy"):null))));
  card.append(ul);
  card.append(el("div",{class:"btn-row no-print",style:"margin-top:12px"},
    el("button",{class:"btn small",onclick:()=>window.print()},"🖨 Print / save report"),
    el("button",{class:"btn small ghost",onclick:()=>startEval()},"Re-evaluate")));
  return card;
}

function buildRecommendations(ev) {
  const recs=[];
  const weak=Object.entries(ev.scores).filter(([,s])=>s<70).sort((a,b)=>a[1]-b[1]);
  weak.slice(0,4).forEach(([sys])=>{
    const b=BODY.find(x=>x.id===sys); if(!b) return;
    const rid=b.remedies[0];
    const r=REMEDIES.find(x=>x.id===rid);
    recs.push({ icon:b.emoji, remedyId:rid,
      text:`${b.name}: ${b.selfcare.split(";")[0].replace(/[.\s]+$/,"")}.` + (r?` Consider ${r.name.toLowerCase()} for ${r.uses[0].toLowerCase()}.`:"") });
  });
  if (!weak.length) recs.push({icon:"🌟", text:"All systems scored well — keep up sleep, movement, hydration and whole-food eating."});
  recs.push({icon:"📅", text:"Recheck your evaluation in about a month to track the trend."});
  recs.push({icon:"👩‍⚕️", text:"These are wellness suggestions, not a diagnosis — discuss persistent symptoms with a clinician."});
  return recs;
}

/* --- Evaluation wizard (modal) --- */
function startEval(){ STATE.evalDraft={ answers:{}, step:0 }; STATE.modal={type:"eval"}; renderModal(); }

function scoreEval(answers) {
  const bySys={};
  EVAL.forEach(q=>{
    const idx = answers[q.id]!=null ? answers[q.id] : 1;
    const pts = [100,75,45,15][idx];
    (bySys[q.sys]=bySys[q.sys]||[]).push(pts);
  });
  const scores={};
  for(const s in bySys) scores[s]=Math.round(bySys[s].reduce((a,b)=>a+b,0)/bySys[s].length);
  const vals=Object.values(scores);
  const overall=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  return { scores, overall };
}

/* ------------------------------- MODAL --------------------------------- */
function renderModal() {
  document.querySelectorAll(".modal-scrim").forEach(m=>m.remove());
  if (!STATE.modal) return;
  const scrim=el("div",{class:"modal-scrim",onclick:e=>{ if(e.target===scrim) closeModal(); }});
  const modal=el("div",{class:"modal"});
  const t=STATE.modal.type;
  if (t==="remedy") modalRemedy(modal);
  else if (t==="addProfile") modalAddProfile(modal);
  else if (t==="log") modalLog(modal);
  else if (t==="eval") modalEval(modal);
  scrim.append(modal);
  document.body.append(scrim);
}
function closeModal(){ STATE.modal=null; document.querySelectorAll(".modal-scrim").forEach(m=>m.remove()); }

function modalRemedy(modal) {
  const r=REMEDIES.find(x=>x.id===STATE.modal.id); if(!r) return;
  modal.append(el("div",{style:"display:flex;justify-content:space-between;align-items:start"},
    el("div",{}, el("div",{class:"tradition",style:"color:var(--ink-3);font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase"}, r.tradition),
      el("h3",{style:"font-size:20px;margin-top:2px"}, r.emoji+" "+r.name)),
    el("button",{class:"btn small ghost",onclick:closeModal},"✕")));
  modal.append(el("div",{style:"margin:6px 0"}, evidenceTag(r.evidence)));
  const dl=el("dl",{class:"remedy-detail"});
  dl.append(el("dt",{},"Traditionally used for"), el("dd",{}, r.uses.join(" · ")));
  dl.append(el("dt",{},"How it's taken"), el("dd",{}, r.how));
  dl.append(el("dt",{},"Why it may help"), el("dd",{}, r.why));
  modal.append(dl);
  modal.append(el("div",{class:"caution"}, el("b",{},"⚠ Caution: "), r.caution));
  const sys=r.systems.map(id=>BODY.find(b=>b.id===id)).filter(Boolean);
  if(sys.length) modal.append(el("div",{class:"filter-row",style:"margin-top:12px"}, el("span",{style:"font-size:12px;color:var(--ink-3);align-self:center"},"Supports:"),
    ...sys.map(b=>el("button",{class:"pill neutral",style:"cursor:pointer",onclick:()=>{ closeModal(); STATE.bodySel=b.id; go("body"); }}, b.emoji+" "+b.name.split(" ")[0]))));
}

function modalAddProfile(modal) {
  modal.append(el("h3",{},"Add a profile"), el("div",{class:"sub"},"Each profile keeps its own vitals and history on this device."));
  const name=el("input",{type:"text",placeholder:"Name",maxlength:"30"});
  const age=el("input",{type:"number",placeholder:"Age",min:"0",max:"120"});
  const sex=el("select",{}, el("option",{value:""},"Sex (optional)"), el("option",{},"Female"), el("option",{},"Male"), el("option",{},"Other"));
  modal.append(el("div",{class:"field"}, el("label",{},"Name"), name));
  modal.append(el("div",{class:"field-row"}, el("div",{class:"field"}, el("label",{},"Age"), age), el("div",{class:"field"}, el("label",{},"Sex"), sex)));
  modal.append(el("div",{class:"btn-row",style:"margin-top:8px"},
    el("button",{class:"btn primary",onclick:()=>{
      const p=newProfile(name.value.trim()||"Me",{age:age.value,sex:sex.value});
      DB.profiles.push(p); DB.activeId=p.id; saveDB(); closeModal(); STATE.tab="dashboard"; render();
    }},"Create"),
    el("button",{class:"btn ghost",onclick:closeModal},"Cancel")));
}

let logKey=null;
function openLog(key){ logKey=key||"bp"; STATE.modal={type:"log"}; renderModal(); }
function modalLog(modal) {
  const p=activeProfile();
  modal.append(el("div",{style:"display:flex;justify-content:space-between;align-items:center"}, el("h3",{},"Log a reading"), el("button",{class:"btn small ghost",onclick:closeModal},"✕")));
  const sel=el("select",{onchange:e=>{ logKey=e.target.value; buildFields(); }});
  VITAL_ORDER.forEach(k=>{ const o=el("option",{value:k}, VITALS[k].icon+" "+VITALS[k].name); if(k===logKey)o.selected=true; sel.append(o); });
  modal.append(el("div",{class:"field"}, el("label",{},"Vital"), sel));
  const fields=el("div",{}); modal.append(fields);
  const inputs={};
  function buildFields(){
    fields.innerHTML=""; for(const k in inputs) delete inputs[k];
    const v=VITALS[logKey];
    const row=el("div",{class:"field-row"});
    v.series.forEach(s=>{
      const inp=el("input",{type:"number",step:"0.1",placeholder:s.name, inputmode:"decimal"});
      inputs[s.id]=inp;
      row.append(el("div",{class:"field"}, el("label",{}, s.name+" ("+v.unit+")"), inp));
    });
    fields.append(row);
    if (v.normal) fields.append(el("div",{class:"sub",style:"margin-top:-4px"},"Healthy: "+v.series.map(s=>v.normal[s.id]?s.name+" "+v.normal[s.id][0]+"–"+v.normal[s.id][1]:"").filter(Boolean).join(", ")));
    setTimeout(()=>{ if(v.series[0]) inputs[v.series[0].id].focus(); },30);
  }
  buildFields();
  modal.append(el("div",{class:"btn-row",style:"margin-top:14px"},
    el("button",{class:"btn primary",onclick:()=>{
      const v=VITALS[logKey]; const r={t:Date.now()}; let ok=false;
      v.series.forEach(s=>{ const val=parseFloat(inputs[s.id].value); if(!isNaN(val)){ r[s.id]=val; ok=true; } });
      if(!ok){ toast("Enter a value first"); return; }
      (p.readings[logKey]=p.readings[logKey]||[]).push(r);
      if (p.reminders[logKey]) p.reminders[logKey].lastDone=Date.now(); else if (REMINDER_TEMPLATES.some(t=>t.id===logKey)) p.reminders[logKey]={lastDone:Date.now()};
      saveDB(); closeModal();
      const st=v.classify(r);
      toast(st==="good"?"Logged ✓ — looks healthy":"Logged ✓ — "+STATUS_LABEL[st]);
      STATE.chartsOpen[logKey]=true; render();
    }},"Save reading"),
    el("button",{class:"btn ghost",onclick:closeModal},"Cancel")));
}

function modalEval(modal) {
  const d=STATE.evalDraft;
  const per=4;
  const pages=Math.ceil(EVAL.length/per);
  modal.append(el("div",{style:"display:flex;justify-content:space-between;align-items:center"},
    el("h3",{},"Full-body evaluation"), el("button",{class:"btn small ghost",onclick:closeModal},"✕")));
  modal.append(el("div",{class:"sub"},"Answer honestly for the last two weeks. Step "+(d.step+1)+" of "+pages+"."));
  const prog=el("div",{class:"wiz-progress"}); for(let i=0;i<pages;i++) prog.append(el("span",{class:i<=d.step?"done":""})); modal.append(prog);

  const start=d.step*per;
  EVAL.slice(start,start+per).forEach(q=>{
    const block=el("div",{class:"q-block"}, el("div",{class:"q"}, q.q));
    const opts=el("div",{class:"q-opts"});
    q.opts.forEach((o,i)=>opts.append(el("button",{class:(d.answers[q.id]===i?"on":""),onclick:()=>{ d.answers[q.id]=i; renderModal(); }}, o)));
    block.append(opts); modal.append(block);
  });

  const answeredThisPage = EVAL.slice(start,start+per).every(q=>d.answers[q.id]!=null);
  const btns=el("div",{class:"btn-row",style:"margin-top:10px"});
  if (d.step>0) btns.append(el("button",{class:"btn ghost",onclick:()=>{ d.step--; renderModal(); }},"Back"));
  if (d.step<pages-1) btns.append(el("button",{class:"btn primary",disabled:answeredThisPage?null:"disabled",onclick:()=>{ if(answeredThisPage){ d.step++; renderModal(); } }},"Next"));
  else btns.append(el("button",{class:"btn primary",disabled:answeredThisPage?null:"disabled",onclick:()=>{
      const p=activeProfile(); const {scores,overall}=scoreEval(d.answers);
      p.evaluations.push({t:Date.now(),answers:d.answers,scores,overall});
      p.reminders.eval={lastDone:Date.now()};
      saveDB(); closeModal(); STATE.tab="checkup"; toast("Evaluation complete — score "+overall); render();
  }},"See my report"));
  modal.append(btns);
}

/* ------------------------------- ROUTER -------------------------------- */
function go(tab){ STATE.tab=tab; window.scrollTo(0,0); render(); }
function syncTabbar(){
  const p=activeProfile();
  const due = p? dueReminders(p) : [];
  const dueTabs = new Set(due.map(d=>d.tab));
  document.querySelectorAll("#tabbar button").forEach(b=>{
    b.classList.toggle("active", b.dataset.tab===STATE.tab);
    b.classList.toggle("has-due", dueTabs.has(b.dataset.tab) && b.dataset.tab!==STATE.tab);
  });
}
document.querySelectorAll("#tabbar button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));

/* ------------------------------- BOOT ---------------------------------- */
loadDB();
if (!DB.profiles.length) seedDemo();
render();
</script>
